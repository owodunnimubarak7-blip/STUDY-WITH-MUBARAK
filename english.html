<script>
    const masterQuestions = [
        { instr: "Grammar & Mechanics: Subject-Verb Agreement.", q: "Neither the teacher nor the students ______ capable of solving the complex riddle immediately.", options: ["is", "are", "was", "has"], correct: 1, exp: "When a subject is joined by 'neither... nor', the verb agrees with the closer subject. 'Students' is plural, so it takes the plural verb 'are'." },
        { instr: "Lexicon & Vocabulary: Identify the closest synonym.", q: "Select the word that is most nearly similar in meaning to 'Ephemeral'.", options: ["Enduring", "Transient", "Precious", "Spurious"], correct: 1, exp: "'Ephemeral' means lasting for a very short time. 'Transient' is a direct synonym, meaning fleeting or temporary." },
        { instr: "Lexicon & Vocabulary: Identify the opposite meaning.", q: "What is the most accurate antonym for the word 'Loquacious'?", options: ["Reticent", "Garrulous", "Verbose", "Articulate"], correct: 0, exp: "'Loquacious' means talkative. 'Reticent' means introverted, silent, or reserved, making it the correct opposite." },
        { instr: "Grammar & Parts of Speech: Pronoun Case Selection.", q: "The grand prize was split equally between Sarah and ______.", options: ["I", "me", "myself", "we"], correct: 1, exp: "The pronoun follows the preposition 'between', requiring the objective case pronoun 'me' rather than the subjective case 'I'." },
        { instr: "Grammar & Structure: Idiomatic Expressions.", q: "To 'take something with a grain of salt' means to:", options: ["Accept it completely", "Skeptically reserve full belief", "Cook with careful measurements", "Exaggerate an event"], correct: 1, exp: "The idiom means to view a statement with skepticism or not to interpret it as literal, objective truth." },


    {
        instr: `PASSAGE A

All over the world till lately and in most of the world till today, mankind has been following the course of nature: that is to say, it has been breeding up to the maximum. To let nature take her course in the reproduction of the human race may have made sense in an age in which we were also letting her take her course in decimating mankind by the casualties of war, pestilence, and famine. Being human, we have at least revolted against that senseless waste. We have started to impose on nature’s heartless play a humane new order of our own. But when once man has begun to interfere with nature, he cannot afford to stop halfway. We cannot, with impunity, cut down the death-rate and at the same time allow the birthrate to go on taking nature’s course. We must consciously try to establish an equilibrium, or sooner or later, famine will stalk abroad again.

Read the passage carefully and answer the questions that follow.`,
        q: "The author observes that",
        options: [
            "War, pestilence and famine were caused by the extravagance of nature",
            "Nature was heartless and senseless",
            "There was a time when uncontrolled birth made sense",
            "It was wise at a time when mankind did not interfere with normal reproduction",
            "Nature was heartless in its reproductive process"
        ],
        correct: 2,
        exp: "The author explains that unrestricted reproduction may have made sense when war, disease and famine also naturally reduced the population. This means there was a time when uncontrolled birth was considered reasonable."
    },

    {
        instr: "PASSAGE A — Choose the option that agrees with the author's views.",
        q: "Which of these statements does not express the opinion of the author?",
        options: [
            "Mankind has started to interfere with the work of nature",
            "Many people had died in the past through want and disease",
            "Mankind should not have the maximum number of children possible",
            "Mankind should take care of its children",
            "Man's present relationship with nature in matters of birth and death is a happy one"
        ],
        correct: 4,
        exp: "The author does not describe man's present relationship with nature as happy. Instead, the author argues that reducing deaths while allowing births to continue unchecked creates an imbalance."
    },

    {
        instr: "PASSAGE A — Answer according to the meaning of the word in the passage.",
        q: "Humane, as used in the passage, means",
        options: [
            "Sensible",
            "Wise",
            "Human",
            "Benevolent",
            "Thorough"
        ],
        correct: 3,
        exp: "Humane means showing kindness, compassion and concern for human welfare. Benevolent is the closest option because it means kind and well-meaning."
    },

    {
        instr: "PASSAGE A — Answer according to the meaning of the expression in the passage.",
        q: "'We must consciously try to establish an equilibrium' implies that mankind must",
        options: [
            "Realistically find an equation",
            "Strive not to be wasteful",
            "Deliberately try to fight nature",
            "Try to fight nature",
            "Purposely find a balance"
        ],
        correct: 4,
        exp: "Equilibrium means a state of balance. The author argues that mankind must deliberately balance the birth rate and death rate to prevent overpopulation and famine."
    },

    {
        instr: "PASSAGE A — Choose the option that best expresses the central idea.",
        q: "The main idea of this passage is that",
        options: [
            "Nature is heartless",
            "Man should control the birth rate",
            "Mankind will soon perish of starvation",
            "Pestilence causes more death than war",
            "Man should change nature's course gradually"
        ],
        correct: 1,
        exp: "The passage emphasizes that since mankind has reduced the death rate, it must also regulate the birth rate to maintain population balance. Therefore, controlling the birth rate is the central idea."
    },

    // PASSAGE B
    // Questions 6–10

    {
        instr: `PASSAGE B

The endeavour to maintain proper standards of fairness in journalism must be pursued. It is fatally easy for the journalist to deviate from the straight path. There is his natural desire to make a story and the insidious temptation to twist facts to square with his paper's policy. Both are as indefensible as the framing of misleading headlines for the sake of effect. The conscientious journalist must check any tendency to bias, and guard against the dangers inherent in personal antipathies or friendships, and in traditional opposition between rival schools of thought. When a political opponent, whose stupidity habitually provokes attack, makes an effective speech, honesty requires that he be given credit for it. Where personal relationships might make it easier and more congenial to keep silent than to criticize, the journalist must never forget his duty to the public and the supreme importance of recording the truth.

Read the passage carefully and answer the questions that follow.`,
        q: "When may a journalist have to act against his own inclination?",
        options: [
            "When his friends act stupidly",
            "When he becomes weak and decrepit",
            "When his enemies make a mistake",
            "When his political opponents frame misleading headlines",
            "After he has been given a bribe"
        ],
        correct: 2,
        exp: "The passage says that when a political opponent makes an effective speech, the journalist must give that opponent credit, even if personal dislike makes this difficult. However, the printed option C says 'make a mistake', which does not accurately match the passage. The intended idea appears to be giving credit to an opponent despite personal inclination."
    },

    let questions = [];
    let currentQ = 0;
    let userAnswers = [];
    let flaggedQuestions = new Set();
    let timerInterval = null;
    let timeRemaining = 900; 
    let timerPaused = false;
    let totalDuration = 900;
    let aiExplanationCache = {};

    const POLLINATION_API_URL = 'https://text.pollinations.ai/';

    function toggleJumpGrid() {
        document.getElementById("jump-grid-wrapper").classList.toggle("hidden");
    }

    function setupSession() {
        const locallyStoredState = localStorage.getItem("mubarak_bio_portal_state");
        if (locallyStoredState) {
            try {
                const parsedState = JSON.parse(locallyStoredState);
                questions = parsedState.questions;
                currentQ = parsedState.currentQ;
                userAnswers = parsedState.userAnswers;
                flaggedQuestions = new Set(parsedState.flaggedQuestions);
                timeRemaining = parsedState.timeRemaining;
                
                if (parsedState.isSubmitted) {
                    executeUIRenderOnSubmit(parsedState.statistics);
                    return;
                }
                startTimer();
                initQuiz();
                return;
            } catch (err) { console.error(err); }
        }
        createNewFreshSession();
    }

    function createNewFreshSession() {
        questions = [...masterQuestions];
        userAnswers = new Array(questions.length).fill(null);
        flaggedQuestions.clear();
        currentQ = 0;
        timeRemaining = 900;
        saveCurrentProgressToStorage(false);
        startTimer();
        initQuiz();
    }

    function saveCurrentProgressToStorage(isSubmitted = false, compiledStats = null) {
        const statePayload = {
            questions: questions, currentQ: currentQ, userAnswers: userAnswers,
            flaggedQuestions: Array.from(flaggedQuestions), timeRemaining: timeRemaining,
            isSubmitted: isSubmitted, statistics: compiledStats
        };
        localStorage.setItem("mubarak_bio_portal_state", JSON.stringify(statePayload));
    }

    function resetSessionData() {
        localStorage.removeItem("mubarak_bio_portal_state");
        location.reload();
    }

    function toggleDarkMode() {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        if (currentTheme === "dark") {
            document.documentElement.removeAttribute("data-theme");
            localStorage.setItem("bio_theme", "light");
        } else {
            document.documentElement.setAttribute("data-theme", "dark");
            localStorage.setItem("bio_theme", "dark");
        }
    }

    if (localStorage.getItem("bio_theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!timerPaused) {
                timeRemaining--;
                updateTimerDisplay();
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    confirmSubmit();
                }
            }
        }, 1000);
    }

    function toggleTimer() {
        timerPaused = !timerPaused;
        document.getElementById("timer-badge").style.opacity = timerPaused ? "0.3" : "1";
    }

    function updateTimerDisplay() {
        const badge = document.getElementById("timer-badge");
        if (!badge) return;
        const mins = Math.floor(timeRemaining / 60);
        const secs = timeRemaining % 60;
        badge.textContent = `⏱️ ${mins}:${secs < 10 ? '0' : ''}${secs}`;
        badge.className = timeRemaining < 180 ? "timer-badge danger" : timeRemaining < 450 ? "timer-badge warning" : "timer-badge";
    }

    function speakQuestion() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const qObj = questions[currentQ];
            const utterance = new SpeechSynthesisUtterance(`${qObj.instr}. ${qObj.q}`);
            window.speechSynthesis.speak(utterance);
        }
    }

    function initQuiz() {
        if (questions.length === 0) return;
        renderActiveQuestion();
        renderNavigatorGrid();
        updateProgressIndicators();
    }

    function renderActiveQuestion() {
        const item = questions[currentQ];
        document.getElementById("instruction-box").textContent = item.instr;
        document.getElementById("q-text").textContent = `${currentQ + 1}. ${item.q}`;
        
        const grid = document.getElementById("options-grid");
        grid.innerHTML = "";
        
        item.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = `option-btn ${userAnswers[currentQ] === idx ? 'selected' : ''}`;
            btn.textContent = opt;
            btn.onclick = () => selectOptionIndex(idx);
            grid.appendChild(btn);
        });

        document.getElementById("prev-btn").disabled = currentQ === 0;
        document.getElementById("next-btn").disabled = currentQ === questions.length - 1;
        
        const flagBtn = document.getElementById("flag-btn");
        flagBtn.className = flaggedQuestions.has(currentQ) ? "flag-btn flagged" : "flag-btn";
    }

    function selectOptionIndex(idx) {
        userAnswers[currentQ] = idx;
        renderActiveQuestion();
        renderNavigatorGrid();
        saveCurrentProgressToStorage(false);
    }

    function navigateQuestion(step) {
        currentQ += step;
        renderActiveQuestion();
        renderNavigatorGrid();
        updateProgressIndicators();
    }

    function updateProgressIndicators() {
        const total = questions.length;
        const percent = Math.round((currentQ + 1) / total * 100);
        document.getElementById("progress-text").textContent = `Item ${currentQ + 1} / ${total}`;
        document.getElementById("progress-percent").textContent = `${percent}%`;
        document.getElementById("progress-fill").style.width = `${percent}%`;
    }

    function renderNavigatorGrid() {
        const gridContainer = document.getElementById("jump-box-grid");
        gridContainer.innerHTML = "";
        
        questions.forEach((_, index) => {
            const item = document.createElement("div");
            item.className = `jump-item`;
            if (index === currentQ) item.classList.add("active");
            if (userAnswers[index] !== null) item.classList.add("answered");
            if (flaggedQuestions.has(index)) item.classList.add("flagged");
            
            item.textContent = index + 1;
            item.onclick = () => {
                currentQ = index;
                renderActiveQuestion();
                renderNavigatorGrid();
                updateProgressIndicators();
                toggleJumpGrid();
            };
            gridContainer.appendChild(item);
        });
    }

    function toggleFlag() {
        if (flaggedQuestions.has(currentQ)) flaggedQuestions.delete(currentQ);
        else flaggedQuestions.add(currentQ);
        renderActiveQuestion();
        renderNavigatorGrid();
    }

    function showSubmitModal() { document.getElementById("submit-modal").classList.remove("hidden"); }
    function closeSubmitModal() { document.getElementById("submit-modal").classList.add("hidden"); }

    function confirmSubmit() {
        closeSubmitModal();
        calculateResults();
    }

    function calculateResults() {
        let correct = 0, wrong = 0, unanswered = 0;
        questions.forEach((q, idx) => {
            if (userAnswers[idx] === null) unanswered++;
            else if (userAnswers[idx] === q.correct) correct++;
            else wrong++;
        });

        const timeTaken = totalDuration - timeRemaining;
        const statistics = {
            correct: correct, wrong: wrong, unanswered: unanswered,
            timeTaken: `${Math.floor(timeTaken / 60)}:${timeTaken % 60 < 10 ? '0' : ''}${timeTaken % 60}`,
            score: correct
        };

        saveCurrentProgressToStorage(true, statistics);
        executeUIRenderOnSubmit(statistics);
    }

    function executeUIRenderOnSubmit(stats) {
        clearInterval(timerInterval);
        document.getElementById("quiz-box").classList.add("hidden");
        document.getElementById("result-box").classList.remove("hidden");

        document.getElementById("final-score").textContent = `${stats.correct} / ${questions.length}`;
        document.getElementById("stat-correct").textContent = stats.correct;
        document.getElementById("stat-wrong").textContent = stats.wrong;
        document.getElementById("stat-unanswered").textContent = stats.unanswered;
        document.getElementById("stat-time").textContent = stats.timeTaken;

        renderReviewCards();
    }

    function renderReviewCards() {
        const container = document.getElementById("review-cards-container");
        container.innerHTML = "";

        questions.forEach((q, idx) => {
            const userAnswer = userAnswers[idx];
            const isCorrect = userAnswer === q.correct;
            const isUnanswered = userAnswer === null;

            const card = document.createElement("div");
            card.className = "review-card";

            const statusClass = isUnanswered ? "badge-unanswered" : isCorrect ? "badge-correct" : "badge-wrong";
            const statusText = isUnanswered ? "Unanswered" : isCorrect ? "Correct" : "Incorrect";

            card.innerHTML = `
                <div><span class="choice-badge ${statusClass}">${statusText}</span></div>
                <div style="font-size:0.85rem; font-weight:700; margin-bottom:6px;">Q${idx+1}: ${q.q}</div>
                <div style="font-size:0.8rem; color:var(--gray); margin-bottom:4px;">Correct Option: <strong>${q.options[q.correct]}</strong></div>
                <div class="explanation-box">${q.exp}</div>
                <button class="action-btn nav-btn" style="margin-top:6px; padding:4px;" onclick="fetchAIExplanation(${idx}, event)">✨ Ask Mubarak AI</button>
                <div id="ai-explanation-${idx}" class="hidden"></div>
            `;
            container.appendChild(card);
        });
    }

    async function fetchAIExplanation(questionIdx, event) {
        const q = questions[questionIdx];
        const container = document.getElementById(`ai-explanation-${questionIdx}`);
        container.classList.remove('hidden');
        container.innerHTML = '<div class="ai-explanation-box">Consulting AI Linguist Hub...</div>';

        try {
            const response = await fetch(POLLINATION_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: [
                        { role: 'system', content: "You are an expert English Language professor. Keep your answers brief, structured, and clear for students." },
                        { role: 'user', content: `Explain the correct grammatical rule or vocabulary meaning for this question: ${q.q}. Options: ${q.options.join(', ')}. Correct index is ${q.correct}.` }
                    ],
                    model: 'openai'
                })
            });
            const text = await response.text();
            container.innerHTML = `<div class="ai-explanation-box"><strong>Mubarak AI:</strong><br>${text.replace(/\n/g, '<br>')}</div>`;
        } catch (e) {
            container.innerHTML = '<div class="ai-explanation-box">Connection timeout. Please double check your local connection parameters.</div>';
        }
    }

    function exportResults() {
        let csv = "Question,Your Choice,Correct Choice\n";
        questions.forEach((q, idx) => {
            const userChoice = userAnswers[idx] !== null ? q.options[userAnswers[idx]] : "None";
            csv += `"${q.q}","${userChoice}","${q.options[q.correct]}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'english-results.csv';
        link.click();
    }

    document.addEventListener('keydown', (e) => {
        if (document.getElementById("quiz-box").classList.contains("hidden")) return;
        if (e.key === "ArrowLeft") navigateQuestion(-1);
        if (e.key === "ArrowRight") navigateQuestion(1);
        if (e.key >= "1" && e.key <= "4") selectOptionIndex(parseInt(e.key) - 1);
    });

    setupSession();
</script>
